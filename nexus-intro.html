<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040c">
<title>Sathya N — • DEVELOPMENT • DESIGN • INNOVATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nexus-intro.css">
<noscript><style>#intro{display:none}body.is-intro{overflow:auto;height:auto}</style></noscript>
</head>
<body class="is-intro">
  <!-- NEXUS LAUNCH SCREEN -->
<div id="goScreen">
    <div class="launch-content">
        <div class="launch-label">NEXUS PROTOCOL // 2026</div>

        <h1>READY TO ENTER?</h1>
        <p>ACCESSING THE DIGITAL REALM</p>

        <button id="goButton">
            <span>▶</span> GO
        </button>

        <div id="loadingArea">
            <div id="loadingText">READY FOR NEURAL LINK</div>

            <div class="loading-track">
                <div id="loadingFill"></div>
            </div>

            <div class="loading-footer">
                <span id="loadingStatus">AWAITING INITIALIZATION</span>
                <span id="loadingPercent">0%</span>
            </div>
        </div>
    </div>
</div>

<!-- ===== NEXUS INTRO (remove this block + intro assets to drop the intro) ===== -->
<div id="intro" aria-label="Intro animation">
  <div id="stage"></div>
  <div id="rays"></div>
  <div class="scanlines"></div>
  <div id="scan"></div>
  <div class="vignette"></div>

  <div id="titleScene">
    <div id="titleWrap">
      <div class="namebox">
        <h1 id="name" aria-label="SATHYA N"></h1>
        <div id="sheen" aria-hidden="true"></div>
      </div>
      <div class="subrow">
        <i id="rule1"></i>
        <p id="sub">• DEVELOPMENT • DESIGN • INNOVATION</p>
        <i id="rule2"></i>
      </div>
      <p id="tag" aria-label="Building ideas into digital experiences."></p>
    </div>
  </div>

  <div id="hud" aria-hidden="true">
    <div class="c tl">SATHYA - - - BEYOND THE INNOVATION</div>
    <div class="c bl"><span id="phase">00 // INITIALISING</span><br><span id="pct">000</span>%</div>
    <div class="c br"><span id="coord">X 0.000 · Y 0.000</span></div>
    <div id="bar"><i></i></div>
  </div>

  <button id="skip" type="button">SKIP INTRO <span>→</span></button>
  <div id="flash"></div>
</div>
<!-- ===== END INTRO ===== -->

<!-- Your real homepage goes here. This placeholder just proves the hand-off. -->
<main id="home">
  <p class="placeholder">STEP INTO MY WORLD OF INNOVATION ENGINE</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<audio id="introAudio" preload="auto">
    <source src="./introaudio.mp3" type="audio/mpeg">
</audio>

<script src="./nexus-intro.js"></script>

</body>
</html>
